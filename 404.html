<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 | Capital</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Archivo+Expanded:wght@700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  .err-page{
    min-height:100vh;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;
    text-align:center;position:relative;overflow:hidden;padding:40px 24px;
  }
  .err-grid{
    position:absolute;inset:0;opacity:.5;
    background-image:linear-gradient(var(--ink-line) 1px, transparent 1px),linear-gradient(90deg, var(--ink-line) 1px, transparent 1px);
    background-size:56px 56px;
    mask-image:radial-gradient(ellipse 70% 60% at 50% 40%, black 30%, transparent 85%);
  }
  .err-inner{position:relative;max-width:520px;}
  .err-code{
    font-family:var(--disp);font-weight:800;font-size:clamp(90px,16vw,150px);line-height:1;color:var(--capital-red);
    letter-spacing:-.02em;margin-bottom:8px;direction:ltr;
  }
  .err-mark{
    font-family:var(--disp);font-weight:800;font-size:20px;border:2px solid var(--capital-red);color:var(--capital-red);
    padding:3px 10px;display:inline-block;margin-bottom:28px;
  }
  .err-title{font-family:var(--ar-disp);font-weight:800;font-size:26px;margin:0 0 12px;}
  .err-sub{color:#9FA5B4;font-size:15.5px;line-height:1.7;margin:0 0 34px;}
  .err-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:30px;}
  .err-lang{font-family:var(--mono);font-size:12px;color:#6E7385;}
  .err-lang a{color:#C7CAD4;border-bottom:1px solid transparent;}
  .err-lang a:hover{color:var(--capital-red);border-color:var(--capital-red);}
</style>
</head>
<body>

<div class="err-page">
  <div class="err-grid"></div>
  <div class="err-inner">
    <div class="err-mark">CAPITAL</div>
    <div class="err-code">404</div>
    <h1 class="err-title">الصفحة اللي بتدور عليها مش موجودة</h1>
    <p class="err-sub">يمكن الرابط اتغيّر أو الصفحة اتنقلت. تقدر ترجع للرئيسية أو تتواصل معانا لو محتاج مساعدة.</p>
    <div class="err-actions">
      <a href="index.html" class="btn btn-primary"><i class="bi bi-house-door-fill"></i>&nbsp; الرئيسية</a>
      <a href="index.html#contact" class="btn btn-outline">تواصل معنا</a>
    </div>
    <div class="err-lang">
      Looking for the English site? <a href="en.html">Go home →</a>
    </div>
  </div>
</div>

</body>
</html>
